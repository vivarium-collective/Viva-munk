question: |
  How do daughter cells track through an open chamber with an absorbing boundary?

study_card:
  goal: "Track lineages in an open chamber where cells crossing the right wall are removed."
  mechanism: "PymunkProcess (open chamber) + AdderGrowDivide + RemoveCrossing at the absorbing boundary."
  expected_result: "A single cell seeds a lineage that grows, divides, and is gradually carried out of the chamber."
  main_expert_question: "Is the division geometry and removal rule representative of the intended device?"

biological_summary: |
  The 'daughter machine' is an open growth geometry used to follow proliferating lineages. A founder cell grows and divides; progeny that cross the absorbing right boundary are removed, mimicking outflow. It exercises division bookkeeping and boundary handling.

report:
  title: "Daughter Machine — multi-cell simulation"
  verdict: passing-with-caveats
  confidence: medium
  evidence_quality: aspirational
  objective: |
