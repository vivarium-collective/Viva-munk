[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-munk"
version = "0.0.5"
description = "multi-cell simulations with pymunk 2d physics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  {name = "Eran Agmon", email = "agmon.eran@gmail.com"},
  {name = "Ryan Spangler"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "process-bigraph",
    "bigraph-schema>=0.0.60",
    "bigraph-viz",
    "pymunk",
    "numpy",
    "matplotlib",
    "Pillow",
    "plum-dispatch",
    # viva_munk/visualizations/* subclass pbg_superpowers.visualization.Visualization.
    "pbg-superpowers",
    # viva_munk/__init__.py imports SQLiteEmitter from process_bigraph.emitter at
    # module load; SQLiteEmitter was extracted to the focused `viva-emitters`
    # package and is only lazily re-exported there, so a standalone
    # `pip install viva-munk` fails with `No module named 'viva_emitters'` unless
    # viva-emitters is declared (it was previously satisfied transitively only
    # when the workbench happened to be installed alongside).
    "viva-emitters",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipdb",
    "build",
    "twine>=4.0.2",
]

[project.urls]
Homepage = "https://github.com/vivarium-collective/Viva-munk"
Repository = "https://github.com/vivarium-collective/Viva-munk"

# Build with hatchling so the wheel can force-include this module's workspace
# content. `packages = ["viva_munk"]` ships the ENTIRE viva_munk/ tree — every
# subpackage, including composites/ and visualizations/ (the package's __init__
# imports them; the old setuptools hand-list once dropped them). No exclude list
# to maintain.
[tool.hatch.build.targets.wheel]
packages = ["viva_munk"]

# Ship the module's workspace content INSIDE the installed package, so a
# wheel/PyPI install exposes its studies + composite-gallery investigation
# read-only in the vivarium-workbench (via lib/federation.linked_workspaces'
# installed-module discovery). Without this a wheel surfaces only the composites
# and the studies list-but-fail-to-open ("Study not found"). workspace.yaml lands
# at viva_munk/workspace.yaml (the federation root); studies/ and investigations/
# are its default-layout subdirs. Only tracked content ships (~38 MB, the
# interactive multibody viz) — the gitignored run stores (runs.db, sims/) do not.
[tool.hatch.build.targets.wheel.force-include]
"workspace.yaml" = "viva_munk/workspace.yaml"
"studies" = "viva_munk/studies"
"investigations" = "viva_munk/investigations"

# NOTE: this package previously declared a [tool.uv.sources] override
# pointing process-bigraph at `../process-bigraph` (editable). That
# section is dev-only convenience for working in a sibling checkout
# layout — but it leaks into downstream consumers when viva-munk is
# pulled as a git dependency, because uv resolves the transitive
# source path as `subdirectory=../process-bigraph` of the git URL,
# which doesn't exist. Removed for now; if you need the local
# editable checkout, install it explicitly:
#
#   pip install -e ../process-bigraph
#
# or add the override in YOUR project's pyproject.toml (not here).
